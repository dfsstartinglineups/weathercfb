name: CFB Weather Site Generator

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

# Grant write access to push commits back to the repository
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests firebase-admin google-cloud-firestore

      - name: Generate Firebase Credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase_credentials.json

      - name: Run CFB Site Generator
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: firebase_credentials.json
        run: python scripts/generate_site.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml team_pages/
          git commit -m "🤖 Auto-update CFB schedule and weather [skip ci]" || echo "No changes to commit"
          git push
